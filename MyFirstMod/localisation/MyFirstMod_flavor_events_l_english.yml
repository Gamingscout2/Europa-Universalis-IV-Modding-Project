l_english:

northymbria_events.1.t: "A Husband for Northymbria"
northymbria_events.1.d: "After the premature end of King Eadgar V of Northymbria's stagnant reign, his prodigal daughter Imogen has risen to take the throne of the kingdom. As fate would have it, the Mercia to the south, longtime ally and friend of the Wolff family, has a bachelor king on the throne, with no heir. It is expected that the two kingdoms may marry, to bind their strength against Norse and Norman occupiers. However, another interesting prospect exists in Britian. The kingdom of Wales also possesses a young unwed king, who is rumored to be a patron of the arts and sciences. This union could elevate the Britons to a technological powerhouse, much to the dismay of the Mercians."
northymbria_events.1.a: "King Albrecht is clearly the correct choice."
northymbria_events.1.b: "Diplomacy be damned, I want to marry a nerd!"
welsh_marriage_modifier: "Welsh Knowledge Sharing"
desc_welsh_marriage_modifier: "Academies and institutions from Wales are sharing their knowledge with us."